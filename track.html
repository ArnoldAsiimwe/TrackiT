<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackiT &bull; Live GPS Broadcaster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- MQTT for real-time cloud broker sync -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0b0f19;
      color: #f3f4f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #111827;
      border: 1px solid #1f2937;
      border-radius: 16px;
      padding: 24px;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
    }
    .icon-circle {
      width: 60px;
      height: 60px;
      background: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px auto;
    }
    h2 { font-size: 1.3rem; margin-bottom: 8px; }
    p { font-size: 0.85rem; color: #94a3b8; line-height: 1.5; margin-bottom: 20px; }
    .input-group {
      text-align: left;
      margin-bottom: 16px;
    }
    label { font-size: 0.75rem; text-transform: uppercase; color: #94a3b8; font-weight: 600; display: block; margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 10px 14px;
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
    }
    input:focus, select:focus { border-color: #3b82f6; }
    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; color: #fff; }
    .status-box {
      margin-top: 20px;
      padding: 14px;
      background: #1f2937;
      border-radius: 8px;
      font-size: 0.8rem;
      text-align: left;
      display: none;
    }
    .stat-row { display: flex; justify-content: space-between; margin-bottom: 6px; }
    .stat-row:last-child { margin-bottom: 0; }
    .stat-lbl { color: #94a3b8; }
    .stat-val { font-family: 'JetBrains Mono', monospace; font-weight: 600; color: #10b981; }
    .pulse-ring {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      margin-right: 6px;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.8); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-circle">
      <i data-lucide="map-pin" style="width: 32px; height: 32px;"></i>
    </div>
    <h2>TrackiT GPS Broadcaster</h2>
    <p>Transmit real-time GPS coordinates directly to the TrackiT Satellite Map.</p>

    <div class="input-group">
      <label>Device Name / Owner</label>
      <input type="text" id="dev-name" placeholder="e.g. Kelvin's iPhone" value="Friend's Phone">
    </div>

    <div class="input-group">
      <label>Device Type</label>
      <select id="dev-type">
        <option value="phone" selected>Mobile Phone (Android / iOS)</option>
        <option value="laptop">Laptop Computer (Windows / Mac)</option>
      </select>
    </div>

    <button class="btn btn-primary" id="btn-share" onclick="toggleSharing()">
      <i data-lucide="crosshair"></i> <span id="btn-text">Transmit Live GPS</span>
    </button>

    <div class="status-box" id="status-box">
      <div class="stat-row">
        <span class="stat-lbl">Status:</span>
        <span class="stat-val"><span class="pulse-ring"></span> Transmitting Live</span>
      </div>
      <div class="stat-row">
        <span class="stat-lbl">Coordinates:</span>
        <span class="stat-val" id="disp-coords">--</span>
      </div>
      <div class="stat-row">
        <span class="stat-lbl">Accuracy:</span>
        <span class="stat-val" id="disp-acc">-- m</span>
      </div>
      <div class="stat-row">
        <span class="stat-lbl">Packets Sent:</span>
        <span class="stat-val" id="disp-packets">0</span>
      </div>
    </div>
  </div>

  <script>
    let isBroadcasting = false;
    let watchId = null;
    let packetCount = 0;
    const deviceId = 'dev-' + Math.random().toString(36).substring(2, 9);
    let mqttClient = null;

    if (window.lucide) lucide.createIcons();

    if (/Mobi|Android|iPhone/i.test(navigator.userAgent)) {
      document.getElementById('dev-type').value = 'phone';
    } else {
      document.getElementById('dev-type').value = 'laptop';
      document.getElementById('dev-name').value = "Friend's Laptop";
    }

    // Connect to free public WebSockets MQTT broker for instant cloud sync
    function initMQTT() {
      try {
        mqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
          clientId: 'sender-' + deviceId,
          clean: true,
          reconnectPeriod: 2000
        });
      } catch (e) {
        console.warn('MQTT init failed', e);
      }
    }
    initMQTT();

    function toggleSharing() {
      if (isBroadcasting) {
        stopSharing();
      } else {
        startSharing();
      }
    }

    function startSharing() {
      if (!navigator.geolocation) {
        alert('Geolocation is not supported by your browser.');
        return;
      }

      isBroadcasting = true;
      document.getElementById('btn-share').className = 'btn btn-danger';
      document.getElementById('btn-text').textContent = 'Stop Transmitting';
      document.getElementById('status-box').style.display = 'block';

      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const accuracy = pos.coords.accuracy || 10;
          const speed = pos.coords.speed !== null ? pos.coords.speed * 3.6 : 0;
          const heading = pos.coords.heading || 0;

          document.getElementById('disp-coords').textContent = `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
          document.getElementById('disp-acc').textContent = `±${Math.round(accuracy)} m`;

          sendLocationPacket({ lat, lng, accuracy, speed, heading });
        },
        (err) => {
          alert('GPS Error: ' + err.message + '. Please allow location access in your browser settings.');
          stopSharing();
        },
        { enableHighAccuracy: true, timeout: 8000, maximumAge: 1000 }
      );
    }

    function stopSharing() {
      isBroadcasting = false;
      if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
      }
      document.getElementById('btn-share').className = 'btn btn-primary';
      document.getElementById('btn-text').textContent = 'Transmit Live GPS';
      document.getElementById('status-box').style.display = 'none';
    }

    function sendLocationPacket(coords) {
      const devName = document.getElementById('dev-name').value || 'Friend Device';
      const devType = document.getElementById('dev-type').value;

      const payload = {
        deviceId: deviceId,
        name: devName,
        type: devType,
        lat: coords.lat,
        lng: coords.lng,
        accuracy: coords.accuracy,
        speed: coords.speed,
        heading: coords.heading,
        updatedAt: new Date().toISOString()
      };

      // 1. Send via Cloud MQTT (Works on GitHub Pages & across any internet connection!)
      if (mqttClient && mqttClient.connected) {
        mqttClient.publish('trackit/arnold/devices', JSON.stringify(payload));
        packetCount++;
        document.getElementById('disp-packets').textContent = packetCount;
      }

      // 2. Fallback to local server API if running locally
      fetch('/api/update-location', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).catch(() => {});
    }
  </script>
</body>
</html>
